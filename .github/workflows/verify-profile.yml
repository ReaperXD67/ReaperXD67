name: Verify profile assets

on:
  push:
    paths:
      - README.md
      - assets/**
      - scripts/**
      - .github/workflows/verify-profile.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify portrait integrity, responsive stills and evidence routes
        run: python3 scripts/verify_identity.py
      - name: Install pinned capture validator dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==13.0.0
      - name: Verify real project captures and script-free showcases
        run: python3 scripts/verify_showcases.py
      - name: Verify actual contribution instruments
        run: python3 scripts/verify_activity.py
