<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
  <title id="title">Aman Kumar flagship engineering systems</title>
  <desc id="desc">Three verified systems connect controlled agent execution, evidence-grounded retrieval, and a live production network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030405"/><stop offset="1" stop-color="#101216"/></linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7ea8ff"/><stop offset=".5" stop-color="#d8ff4f"/><stop offset="1" stop-color="#ff5f38"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#f4f1e8" stroke-opacity=".045"/></pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Segoe UI,ui-sans-serif,system-ui,sans-serif}
      .label{font-size:9px;font-weight:700;letter-spacing:1.4px;fill:#97999f}.name{font-size:18px;font-weight:730;fill:#f4f1e8}.detail{font-size:10px;fill:#a8aaae}.proof{font-size:9px;font-weight:700;letter-spacing:1px;fill:#d8ff4f}
      .active{fill:#0a0b0c;stroke:#d8ff4f;stroke-opacity:.72}.wire{fill:none;stroke:#656970;stroke-width:1;stroke-opacity:.58}.live{fill:none;stroke:url(#trace);stroke-width:1.6;stroke-dasharray:7 11}
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="308" rx="8" fill="url(#bg)" stroke="#505258"/>
  <rect x="1" y="1" width="898" height="308" rx="8" fill="url(#grid)"/>
  <text x="28" y="31" class="mono label" fill="#ff5f38">FLAGSHIP SYSTEM SPINE / SOURCE LINKED</text>
  <text x="872" y="31" text-anchor="end" class="mono proof">EVIDENCE BUS ACTIVE</text>

  <path d="M128 213V239H772V213" class="wire"/>
  <path id="proofBus" d="M128 213V239H772V213" class="live"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3.4s" repeatCount="indefinite"/></path>
  <circle r="4" fill="#d8ff4f"><animateMotion dur="5.2s" repeatCount="indefinite"><mpath href="#proofBus"/></animateMotion></circle>

  <g transform="translate(28 61)">
    <rect width="286" height="152" class="active"/>
    <text x="16" y="24" class="mono label" fill="#7ea8ff">CONTROL / DURABLE EXECUTION</text>
    <text x="16" y="56" class="sans name">Autonomous Personal Agent</text>
    <text x="16" y="82" class="mono detail">OUTBOX + LEASES + RETRIES</text>
    <text x="16" y="101" class="mono detail">APPROVALS + POLICY + AUDIT</text>
    <text x="16" y="132" class="mono proof">62 TESTS / CI / SBOM</text>
  </g>
  <g transform="translate(307 61)">
    <rect width="286" height="152" class="active"/>
    <text x="16" y="24" class="mono label" fill="#d8ff4f">EVIDENCE / RETRIEVAL</text>
    <text x="16" y="56" class="sans name">AtlasLM</text>
    <text x="16" y="82" class="mono detail">DENSE + BM25 + RRF + MMR</text>
    <text x="16" y="101" class="mono detail">ABSTAIN + CITE + TRACE</text>
    <text x="16" y="132" class="mono proof">LIVE VECTOR STORE / EVALS</text>
  </g>
  <g transform="translate(586 61)">
    <rect width="286" height="152" class="active"/>
    <text x="16" y="24" class="mono label" fill="#ff5f38">PRODUCTION / SIGNED BOUNDARY</text>
    <text x="16" y="56" class="sans name">MinePulse / KarixMC</text>
    <text x="16" y="82" class="mono detail">NEXT + PAPER + POSTGRES</text>
    <text x="16" y="101" class="mono detail">HMAC + NONCE + LEDGERS</text>
    <text x="16" y="132" class="mono proof">LIVE VPS / BACKUPS / RUNBOOKS</text>
  </g>

  <circle cx="128" cy="239" r="5" fill="#7ea8ff"/><circle cx="450" cy="239" r="5" fill="#d8ff4f"/><circle cx="772" cy="239" r="5" fill="#ff5f38"/>
  <text x="28" y="281" class="mono label">CONTROL THE ACTION</text>
  <text x="450" y="281" text-anchor="middle" class="mono label">EXPOSE THE EVIDENCE</text>
  <text x="872" y="281" text-anchor="end" class="mono label">OPERATE THE SYSTEM</text>
  <text x="28" y="298" class="mono proof">BUILD</text><text x="305" y="298" class="mono proof">MEASURE</text><text x="585" y="298" class="mono proof">VERIFY</text><text x="872" y="298" text-anchor="end" class="mono proof">SHIP</text>
</svg>
