<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="684" viewBox="0 0 1000 684" role="img" aria-labelledby="title desc"><title id="title">Three systems. Three boundaries worth defending.</title><desc id="desc">Autonomous Personal Agent holds high-impact work for human approval before durable execution. AtlasLM fuses dense and lexical retrieval, then gates answers on sufficient evidence and citations. KarixMC authenticates Paper events across an HMAC boundary and uses purchase claims and delivery receipts. Simplified architecture: follow the README links for source and limitations.</desc><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><rect width="1000" height="684" fill="#0b0d0e"/><rect x=".5" y=".5" width="999" height="683" fill="none" stroke="#454c48"/><text x="34" y="63" fill="#f3f1e9" font-size="42" font-weight="600" >Three systems.</text><text x="34" y="111" fill="#f3f1e9" font-size="35" font-weight="400" >Three boundaries worth defending.</text><text x="966" y="61" fill="#d8ff4f" font-size="15" font-weight="600" text-anchor="end">ACTION</text><text x="966" y="85" fill="#d8ff4f" font-size="15" font-weight="600" text-anchor="end">EVIDENCE</text><text x="966" y="109" fill="#d8ff4f" font-size="15" font-weight="600" text-anchor="end">REALITY</text><path d="M34 143H966" stroke="#454c48" stroke-width="1.6" fill="none" /><text x="34" y="180" fill="#ff6840" font-size="15" font-weight="600" >AUTONOMOUS AGENT</text><text x="34" y="220" fill="#f3f1e9" font-size="29" font-weight="500" >Permission is</text><text x="34" y="253" fill="#f3f1e9" font-size="29" font-weight="500" >not a prompt.</text><rect x="365" y="197" width="109" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="419.5" y="226" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Intent</text><path d="M474 219H495" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M490 215L495 219L490 223" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="495" y="197" width="122" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="556" y="226" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Policy</text><path d="M617 219H638" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M633 215L638 219L633 223" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="638" y="197" width="150" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="713" y="226" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Outbox</text><path d="M788 219H809" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M804 215L809 219L804 223" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="809" y="197" width="157" height="44" fill="#d8ff4f" stroke="#d8ff4f"/><text x="887.5" y="226" fill="#0b0d0e" font-size="19" font-weight="500" text-anchor="middle">Owned lease</text><path d="M556 241V272H714" stroke="#ff6840" stroke-width="1.6" fill="none" /><text x="725" y="278" fill="#ff6840" font-size="18" font-weight="500" >Human approval</text><text x="365" y="307" fill="#b1b6b3" font-size="18" font-weight="400" >A stale worker cannot commit the result.</text><path d="M34 333H966" stroke="#454c48" stroke-width="1.6" fill="none" /><text x="34" y="370" fill="#ff6840" font-size="15" font-weight="600" >ATLASLM</text><text x="34" y="410" fill="#f3f1e9" font-size="29" font-weight="500" >Confidence is</text><text x="34" y="443" fill="#f3f1e9" font-size="29" font-weight="500" >not evidence.</text><rect x="365" y="382" width="109" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="419.5" y="411" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Dense</text><rect x="365" y="441" width="109" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="419.5" y="470" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">BM25</text><path d="M474 404H489V434H511M474 463H489V434" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M489 434H511" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M506 430L511 434L506 438" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="511" y="412" width="167" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="594.5" y="441" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Fuse + rerank</text><path d="M678 434H699" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M694 430L699 434L694 438" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="699" y="412" width="112" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="755" y="441" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Evidence</text><path d="M811 434H832" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M827 430L832 434L827 438" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="832" y="412" width="134" height="44" fill="#d8ff4f" stroke="#d8ff4f"/><text x="899" y="441" fill="#0b0d0e" font-size="19" font-weight="500" text-anchor="middle">Cite / stop</text><text x="365" y="498" fill="#b1b6b3" font-size="18" font-weight="400" >Insufficient support can stop the answer.</text><path d="M34 524H966" stroke="#454c48" stroke-width="1.6" fill="none" /><text x="34" y="561" fill="#ff6840" font-size="15" font-weight="600" >KARIXMC / MINEPULSE</text><text x="34" y="601" fill="#f3f1e9" font-size="29" font-weight="500" >Rewards need</text><text x="34" y="634" fill="#f3f1e9" font-size="29" font-weight="500" >a trusted event.</text><rect x="365" y="585" width="109" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="419.5" y="614" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Paper</text><path d="M474 607H495" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M490 603L495 607L490 611" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="495" y="585" width="122" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="556" y="614" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">HMAC</text><path d="M617 607H638" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M633 603L638 607L633 611" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="638" y="585" width="150" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="713" y="614" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Ledger</text><path d="M788 607H809" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M804 603L809 607L804 611" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="809" y="585" width="157" height="44" fill="#d8ff4f" stroke="#d8ff4f"/><text x="887.5" y="614" fill="#0b0d0e" font-size="19" font-weight="500" text-anchor="middle">Receipt</text><path d="M627 552V648" stroke="#ff6840" stroke-width="1.6" fill="none" stroke-dasharray="3 5"/><text x="365" y="659" fill="#b1b6b3" font-size="18" font-weight="400" >Signed events. Expiring claims. Recorded delivery.</text></svg>
