<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1052" viewBox="0 0 460 1052" role="img" aria-labelledby="title desc"><title id="title">Three systems. Three boundaries worth defending.</title><desc id="desc">Autonomous Personal Agent holds high-impact work for human approval before durable execution. AtlasLM fuses dense and lexical retrieval, then gates answers on sufficient evidence and citations. KarixMC authenticates Paper events across an HMAC boundary and uses purchase claims and delivery receipts. Simplified architecture: follow the README links for source and limitations.</desc><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><rect width="460" height="1052" fill="#0b0d0e"/><rect x=".5" y=".5" width="459" height="1051" fill="none" stroke="#454c48"/><text x="24" y="56" fill="#f3f1e9" font-size="35" font-weight="600" >Three systems.</text><text x="24" y="97" fill="#f3f1e9" font-size="30" font-weight="400" >Three boundaries</text><text x="24" y="134" fill="#f3f1e9" font-size="30" font-weight="400" >worth defending.</text><path d="M24 161H436" stroke="#454c48" stroke-width="1.6" fill="none" /><text x="24" y="197" fill="#ff6840" font-size="16" font-weight="600" >AUTONOMOUS AGENT</text><text x="24" y="239" fill="#f3f1e9" font-size="27" font-weight="500" >Permission is not a prompt.</text><rect x="24" y="266" width="112" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="80" y="295" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Intent</text><path d="M136 288H157" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M152 284L157 288L152 292" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="157" y="266" width="123" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="218.5" y="295" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Policy</text><path d="M280 288H301" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M296 284L301 288L296 292" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="301" y="266" width="135" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="368.5" y="295" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Outbox</text><path d="M219 310V341H272" stroke="#ff6840" stroke-width="1.6" fill="none" /><text x="284" y="348" fill="#ff6840" font-size="20" font-weight="500" >Approval</text><text x="24" y="383" fill="#b1b6b3" font-size="20" font-weight="400" >Owned leases refuse stale completion.</text><path d="M24 411H436" stroke="#454c48" stroke-width="1.6" fill="none" /><text x="24" y="447" fill="#ff6840" font-size="16" font-weight="600" >ATLASLM</text><text x="24" y="489" fill="#f3f1e9" font-size="27" font-weight="500" >Confidence is not evidence.</text><rect x="24" y="516" width="100" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="74" y="545" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Dense</text><rect x="24" y="573" width="100" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="74" y="602" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">BM25</text><path d="M124 538H144V568H165M124 595H144V568" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M144 568H165" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M160 564L165 568L160 572" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="165" y="546" width="130" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="230" y="575" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Fuse / rank</text><path d="M295 568H316" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M311 564L316 568L311 572" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="316" y="546" width="120" height="44" fill="#d8ff4f" stroke="#d8ff4f"/><text x="376" y="575" fill="#0b0d0e" font-size="18" font-weight="500" text-anchor="middle">Cite / stop</text><text x="24" y="650" fill="#b1b6b3" font-size="20" font-weight="400" >Evidence + citation gates can abstain.</text><path d="M24 680H436" stroke="#454c48" stroke-width="1.6" fill="none" /><text x="24" y="716" fill="#ff6840" font-size="16" font-weight="600" >KARIXMC / MINEPULSE</text><text x="24" y="758" fill="#f3f1e9" font-size="26" font-weight="500" >Rewards need a trusted event.</text><rect x="24" y="786" width="112" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="80" y="815" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Paper</text><path d="M136 808H157" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M152 804L157 808L152 812" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="157" y="786" width="123" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="218.5" y="815" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">HMAC</text><path d="M280 808H301" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><path d="M296 804L301 808L296 812" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="301" y="786" width="135" height="44" fill="#0b0d0e" stroke="#454c48"/><text x="368.5" y="815" fill="#f3f1e9" font-size="19" font-weight="500" text-anchor="middle">Ledger</text><path d="M368 830V861H285" stroke="#d8ff4f" stroke-width="1.6" fill="none" /><rect x="142" y="841" width="143" height="44" fill="#d8ff4f" stroke="#d8ff4f"/><text x="213.5" y="870" fill="#0b0d0e" font-size="19" font-weight="500" text-anchor="middle">Receipt</text><path d="M291 773V831" stroke="#ff6840" stroke-width="1.6" fill="none" stroke-dasharray="3 5"/><text x="24" y="929" fill="#b1b6b3" font-size="20" font-weight="400" >Expiring claims. Recorded delivery.</text><path d="M24 959H436" stroke="#454c48" stroke-width="1.6" fill="none" /><text x="24" y="995" fill="#b1b6b3" font-size="14" font-weight="600" >SIMPLIFIED SYSTEM MAP</text><text x="24" y="1027" fill="#f3f1e9" font-size="18" font-weight="400" >Implementation + scope linked below.</text></svg>
